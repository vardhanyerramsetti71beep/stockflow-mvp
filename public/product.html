<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · StockFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app" data-page="products">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="mobile-bar" id="mobile-bar"></header>
    <main class="container">
      <a class="back-link" href="/products.html"><span data-icon="back" data-size="16"></span> Back to products</a>
      <div class="page-head">
        <div>
          <p class="eyebrow" id="eyebrow">New product</p>
          <h1 id="heading">Add product</h1>
        </div>
      </div>

      <form id="product-form" class="form-layout" novalidate>
        <div class="flash flash-error form-error" hidden><span data-icon="alert" data-size="16"></span><span></span></div>

        <section class="card">
          <h2>Details</h2>
          <p class="muted small section-sub">What the product is and how you identify it.</p>
          <div class="grid-2">
            <div class="field">
              <label for="name">Name <span class="req">*</span></label>
              <input id="name" name="name" type="text" placeholder="e.g. Ceramic Mug" maxlength="200" required>
            </div>
            <div class="field">
              <label for="sku">SKU <span class="req">*</span></label>
              <input id="sku" name="sku" type="text" placeholder="e.g. MUG-001" maxlength="64" required>
              <small class="hint">Unique within your organization.</small>
            </div>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>
          </div>
        </section>

        <section class="card">
          <h2>Stock</h2>
          <p class="muted small section-sub">How many you have and when to warn you.</p>
          <div class="grid-2">
            <div class="field">
              <label for="quantityOnHand">Quantity on hand <span class="req">*</span></label>
              <input id="quantityOnHand" name="quantityOnHand" type="number" step="1" min="0" value="0" required>
            </div>
            <div class="field">
              <label for="lowStockThreshold">Low stock threshold</label>
              <input id="lowStockThreshold" name="lowStockThreshold" type="number" step="1" min="0">
              <small class="hint">Leave empty to use the default (<span id="default-threshold">5</span>).</small>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Pricing</h2>
          <p class="muted small section-sub">Optional. Used for reference only.</p>
          <div class="grid-2">
            <div class="field">
              <label for="costPrice">Cost price (₹)</label>
              <input id="costPrice" name="costPrice" type="number" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="field">
              <label for="sellingPrice">Selling price (₹)</label>
              <input id="sellingPrice" name="sellingPrice" type="number" step="0.01" min="0" placeholder="0.00">
            </div>
          </div>
        </section>

        <div class="form-actions sticky">
          <span class="muted small meta" id="meta"></span>
          <a class="btn btn-ghost" href="/products.html">Cancel</a>
          <button class="btn btn-primary" type="submit" id="save-btn">Create product</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
